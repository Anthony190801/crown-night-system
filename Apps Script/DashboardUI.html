<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crown Night Sedipro 2026</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
      color: #333;
    }

    #app {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
    }

    .estado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #f0f0f0;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
    }

    .datos {
      margin-top: 20px;
    }

    .dato {
      margin-bottom: 10px;
    }

    .separador {
      margin: 25px 0;
      border: none;
      border-top: 1px solid #ddd;
    }

  </style>

</head>

<body>
  <div id="app">
    <h1>
      Crown Night Sedipro 2026
    </h1>
    <p>
      Dashboard de votación
    </p>
    <div id="estado" class="estado">
      Cargando información...
    </div>
    <div id="datos" class="datos"></div>
  </div>
  <script>
    /**
     * ------------------------------------------------------
     * INICIALIZACIÓN DEL DASHBOARD
     * ------------------------------------------------------
     */
    document.addEventListener("DOMContentLoaded",cargarDashboard);
    /**
     * ------------------------------------------------------
     * CARGA DE DATOS
     * ------------------------------------------------------
     */
    function cargarDashboard() {
      actualizarEstado("Cargando información...");
      google.script.run
        .withSuccessHandler(mostrarDatos)
        .withFailureHandler(mostrarError)
        .obtenerDatosDashboard();
    }
    /**
     * ------------------------------------------------------
     * MOSTRAR DATOS
     * ------------------------------------------------------
     */
    function mostrarDatos(datos) {
      actualizarEstado(
        "Conexión con el backend establecida correctamente."
      );
      const resumen = datos.resumen;
      const datosContainer = document.getElementById("datos");

      datosContainer.innerHTML = `

        <h2>
          Estado de la votación
        </h2>

        <div class="dato">
          <strong>Votos válidos:</strong>
          ${resumen.votosValidos}
        </div>

        <div class="dato">
          <strong>Pendientes de completar:</strong>
          ${resumen.pendientes}
        </div>

        <div class="dato">
          <strong>Con incidencia:</strong>
          ${resumen.incidencias}
        </div>

        <div class="dato">
          <strong>Pagos pendientes:</strong>
          ${resumen.pagosPendientes}
        </div>

        <div class="dato">
          <strong>Total registrados:</strong>
          ${resumen.totalRegistros}
        </div>


        <hr class="separador">


        <h2>
          Indicadores del sistema
        </h2>

        <div class="dato">
          <strong>Pagos validados:</strong>
          ${resumen.pagosValidados}
        </div>

        <div class="dato">
          <strong>Tickets enviados:</strong>
          ${resumen.ticketsEnviados}
        </div>

        <div class="dato">
          <strong>Porcentaje de envío:</strong>
          ${resumen.porcentajeEnvio.toFixed(2)}%
        </div>

        <div class="dato">
          <strong>Estados desconocidos:</strong>
          ${resumen.registrosEstadoDesconocido}
        </div>

      `;
    }
    /**
     * ------------------------------------------------------
     * MANEJO DE ERRORES
     * ------------------------------------------------------
     */
    function mostrarError(error) {
      actualizarEstado("No fue posible obtener los datos del Dashboard.",true);
      console.error(error);
    }
    /**
     * ------------------------------------------------------
     * ESTADO DE CONEXIÓN
     * ------------------------------------------------------
     */
    function actualizarEstado(mensaje,esError = false) {
      const estado = document.getElementById("estado");
      estado.textContent = mensaje;
      estado.classList.toggle("error",esError);
    }
  </script>
</body>
</html>
